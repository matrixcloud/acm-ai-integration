plugins {
    id 'base'
    id 'com.diffplug.spotless' version '8.10.1'
    id 'com.github.spotbugs' version '6.5.11' apply false
}

def serviceFileEncoding = 'UTF-8'
def serviceTimeZone = 'Asia/Shanghai'

allprojects {
    group = 'org.acm'
    version = '0.0.1-SNAPSHOT'
}

subprojects {
		pluginManager.withPlugin('io.spring.dependency-management') {
			dependencyManagement {
				imports {
					mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.1.3"
					mavenBom "io.github.resilience4j:resilience4j-bom:2.4.0"
				}
			}
		}

	pluginManager.withPlugin('org.springframework.boot') {
        tasks.named('bootBuildImage') {
            imageName = "acm/${project.name}:${project.version}"
            tags = ["acm/${project.name}:latest"]
            environment = [
                "BP_JVM_VERSION": "17",
                "BPE_APPEND_JAVA_TOOL_OPTIONS": "-Dfile.encoding=${serviceFileEncoding} -Duser.timezone=${serviceTimeZone}",
                "BPE_DEFAULT_TZ": serviceTimeZone,
                "BPE_DELIM_JAVA_TOOL_OPTIONS": " "
            ]
            builder = "docker.m.daocloud.io/paketobuildpacks/builder-noble-java-tiny:latest"
            // run image 版本须与 builder 元数据中的 stack runImage 一致
            runImage = "docker.m.daocloud.io/paketobuildpacks/ubuntu-noble-run-tiny:0.0.122"
        }
    }

    pluginManager.withPlugin('java') {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(17)
            }
        }

        apply plugin: 'com.diffplug.spotless'
        spotless {
            java {
                target 'src/**/*.java'
                googleJavaFormat('1.28.0')
            }
        }

        apply plugin: 'jacoco'
        apply plugin: 'checkstyle'
        checkstyle {
            toolVersion = '10.24.0'
        }
        apply plugin: 'com.github.spotbugs'
        spotbugs {
            effort = 'max'
            excludeFilter = rootProject.file('config/spotbugs/exclude.xml')
        }
        tasks.matching { it.name.startsWith('spotbugs') && it.name != 'spotbugsMain' }
            .configureEach { enabled = false }
        tasks.named('test') {
            useJUnitPlatform()
            systemProperty 'file.encoding', serviceFileEncoding
            systemProperty 'user.timezone', serviceTimeZone
        }
    }
}
