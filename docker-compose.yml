services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      - 'POSTGRES_DB=acm'
      - 'POSTGRES_USER=acm'
      - 'POSTGRES_PASSWORD=Qwerty123!'
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:8.2
    ports:
      - "6379:6379"

volumes:
  postgres_data:
