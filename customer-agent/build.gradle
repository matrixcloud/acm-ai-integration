plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot'
	id 'io.spring.dependency-management'
}

description = 'customer-agent'

dependencies {
	implementation project(':common-lib')
	implementation 'org.springframework.boot:spring-boot-http-client'
	implementation 'org.springframework.boot:spring-boot-micrometer-tracing-brave'
	implementation 'org.springframework.boot:spring-boot-restclient'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
	implementation 'io.micrometer:micrometer-registry-prometheus'
	implementation 'io.micrometer:micrometer-tracing-bridge-brave'
	implementation 'org.flywaydb:flyway-database-postgresql'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'
	implementation 'org.mapstruct:mapstruct:1.6.3'
	implementation platform('org.springframework.ai:spring-ai-bom:2.0.1')
	implementation 'org.springframework.ai:spring-ai-starter-model-openai'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
	testImplementation 'org.springframework.boot:spring-boot-micrometer-tracing-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

sourceSets {
	integrationTest {
		java.srcDir 'src/integrationTest/java'
		resources.srcDir 'src/integrationTest/resources'
		compileClasspath += sourceSets.main.output
		runtimeClasspath += output + compileClasspath
	}
}

configurations {
	integrationTestImplementation.extendsFrom testImplementation
	integrationTestRuntimeOnly.extendsFrom testRuntimeOnly
}

dependencies {
	integrationTestImplementation 'org.springframework.boot:spring-boot-testcontainers'
	integrationTestImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	integrationTestImplementation 'org.testcontainers:testcontainers-postgresql'
}

tasks.register('integrationTest', Test) {
	description = 'Runs PostgreSQL integration tests.'
	group = LifecycleBasePlugin.VERIFICATION_GROUP
	testClassesDirs = sourceSets.integrationTest.output.classesDirs
	classpath = sourceSets.integrationTest.runtimeClasspath
	useJUnitPlatform()
	shouldRunAfter tasks.named('test')
}

def coverageExclusions = [
	'org/acm/ca/CustomerAgentApplication*',
	'org/acm/ca/infra/AuditingConfig*',
	'**/*MapperImpl*'
]

def coreCoverageClasses = files(sourceSets.main.output.asFileTree.matching {
	include 'org/acm/ca/domain/**'
	include 'org/acm/ca/application/**'
})

def allCoverageClasses = files(sourceSets.main.output.asFileTree.matching {
	exclude coverageExclusions
})

tasks.named('test') {
	finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	classDirectories.setFrom(allCoverageClasses)
	reports {
		xml.required = true
		html.required = true
		csv.required = false
	}
}

tasks.named('jacocoTestCoverageVerification') {
	dependsOn tasks.named('test')
	classDirectories.setFrom(coreCoverageClasses)
	violationRules {
		rule {
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.85
			}
			limit {
				counter = 'BRANCH'
				value = 'COVEREDRATIO'
				minimum = 0.75
			}
		}
	}
}

tasks.register('jacocoMergedReport', JacocoReport) {
	dependsOn tasks.named('test'), tasks.named('integrationTest')
	executionData(
		layout.buildDirectory.file('jacoco/test.exec'),
		layout.buildDirectory.file('jacoco/integrationTest.exec')
	)
	sourceDirectories.setFrom(sourceSets.main.allSource.srcDirs)
	classDirectories.setFrom(allCoverageClasses)
	reports {
		xml.required = true
		html.required = true
		csv.required = false
	}
}

tasks.register('jacocoMergedCoverageVerification', JacocoCoverageVerification) {
	dependsOn tasks.named('test'), tasks.named('integrationTest')
	executionData(
		layout.buildDirectory.file('jacoco/test.exec'),
		layout.buildDirectory.file('jacoco/integrationTest.exec')
	)
	sourceDirectories.setFrom(sourceSets.main.allSource.srcDirs)
	classDirectories.setFrom(allCoverageClasses)
	violationRules {
		rule {
			limit {
				counter = 'LINE'
				value = 'COVEREDRATIO'
				minimum = 0.80
			}
			limit {
				counter = 'BRANCH'
				value = 'COVEREDRATIO'
				minimum = 0.70
			}
		}
	}
}

tasks.named('check') {
	dependsOn tasks.named('integrationTest')
	dependsOn tasks.named('jacocoTestCoverageVerification')
	dependsOn tasks.named('jacocoMergedReport')
	dependsOn tasks.named('jacocoMergedCoverageVerification')
}
