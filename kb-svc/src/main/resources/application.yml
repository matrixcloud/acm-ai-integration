spring:
  application:
    name: kb-svc
  datasource:
    url: jdbc:postgresql://localhost:5432/kb
    username: acm
    password: Qwerty123!
  flyway:
    enabled: true
    table: flyway_schema_history_kb
    baseline-on-migrate: true
    baseline-version: 0
  ai:
    openai:
      api-key: ${DASHSCOPE_API_KEY}
      base-url: ${DASHSCOPE_URL:https://llm-e9ka6krk9oaxv2lp.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
      embedding:
        model: text-embedding-v4
        dimensions: 1024
      chat:
        model: qwen-plus
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1024
server:
  port: 8001

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761}/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health
  tracing:
    sampling:
      probability: 1.0

logging:
  file:
    path: ${LOG_PATH:./logs}