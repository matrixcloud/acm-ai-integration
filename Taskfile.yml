version: "3"

vars:
  FRONTEND_DIR: webapps/customer-app

tasks:
  default:
    desc: "列出所有可用任务"
    cmds:
      - task --list

  # ─────────────────────── 基础设施 ───────────────────────

  up:
    desc: "启动 Postgres + Redis（后台）"
    cmds:
      - docker compose up -d

  down:
    desc: "停止并移除容器"
    cmds:
      - docker compose down

  logs:
    desc: "查看基础设施日志（前台）"
    cmds:
      - docker compose logs -f

  # ─────────────────────── Gradle 构建 ───────────────────────

  build:
    desc: "构建所有 Gradle 子项目（跳过测试）"
    cmds:
      - ./gradlew build -x test {{.CLI_ARGS}}

  test:
    desc: "运行所有 Gradle 子项目测试"
    cmds:
      - ./gradlew test {{.CLI_ARGS}}

  format:
    desc: "格式化全部 Java 源码（google-java-format）"
    cmds:
      - ./gradlew spotlessApply

  test-svc:
    desc: "运行单个服务测试（用法: task test-svc SVC=order-svc）"
    vars:
      SVC: "{{.SVC}}"
    preconditions:
      - sh: 'test -n "{{.SVC}}"'
        msg: "请指定服务名，例如: task test-svc SVC=order-svc"
    cmds:
      - ./gradlew :{{.SVC}}:test

  clean:
    desc: "清理 Gradle 构建产物"
    cmds:
      - ./gradlew clean

  # ─────────────────────── 镜像构建 ───────────────────────

  build-image:
    desc: "构建单个应用镜像（Spring 服务用模块名如 SVC=order-svc，前端用 webapps 目录名如 SVC=customer-app）"
    vars:
      SVC: "{{.SVC}}"
    preconditions:
      - sh: 'test -n "{{.SVC}}"'
        msg: "请指定应用名，例如: task build-image SVC=order-svc"
      - sh: '[ -d "webapps/{{.SVC}}" ] || [ -d "{{.SVC}}" ]'
        msg: "未知应用: {{.SVC}}（Spring 服务用模块名，前端用 webapps 下的目录名）"
    cmds:
      - |
        if [ -d "webapps/{{.SVC}}" ]; then
          ver=$(node -p "require('./webapps/{{.SVC}}/package.json').version")
          docker build \
            -f webapps/Dockerfile \
            --build-arg "APP={{.SVC}}" \
            -t "acm/{{.SVC}}:$ver" \
            -t "acm/{{.SVC}}:latest" \
            webapps
        else
          ./gradlew :{{.SVC}}:bootBuildImage
        fi

  build-all-images:
    desc: "构建全部应用镜像（所有 Spring 服务 + webapps 下所有前端）"
    cmds:
      - ./gradlew bootBuildImage --parallel
      - |
        for dir in webapps/*/; do
          name=$(basename "$dir")
          ver=$(node -p "require('./$dir/package.json').version")
          docker build \
            -f webapps/Dockerfile \
            --build-arg "APP=$name" \
            -t "acm/$name:$ver" \
            -t "acm/$name:latest" \
            webapps
        done

  # ─────────────────────── 运行服务 ───────────────────────

  run:
    desc: "运行单个服务（用法: task run SVC=order-svc）"
    vars:
      SVC: "{{.SVC}}"
    preconditions:
      - sh: 'test -n "{{.SVC}}"'
        msg: "请指定服务名，例如: task run SVC=order-svc"
    cmds:
      - ./gradlew :{{.SVC}}:bootRun

  run-all:
    desc: "并行运行所有 Spring Boot 服务（注册中心未就绪时各服务自动重试注册）"
    deps:
      - task: boot
        vars: { SVC: registry-svc }
      - task: boot
        vars: { SVC: gateway-svc }
      - task: boot
        vars: { SVC: customer-agent }
      - task: boot
        vars: { SVC: order-svc }
      - task: boot
        vars: { SVC: kb-svc }

  boot:
    internal: true
    vars:
      SVC: "{{.SVC}}"
    cmds:
      - ./gradlew :{{.SVC}}:bootRun

  # ─────────────────────── 前端 ───────────────────────

  web:
    desc: "启动前端开发服务器（用法: task web APP=kb-app；无参数并行启动全部）"
    vars:
      APP: "{{.APP}}"
    preconditions:
      - sh: '[ -z "{{.APP}}" ] || [ -d "webapps/{{.APP}}" ]'
        msg: "未知前端应用: {{.APP}}（应为 webapps 下的目录名）"
    cmds:
      - |
        if [ -n "{{.APP}}" ]; then
          cd "webapps/{{.APP}}" && exec pnpm run dev
        else
          for dir in webapps/*/; do
            name=$(basename "$dir")
            echo ">>> [$name] 启动开发服务器"
            (cd "$dir" && pnpm run dev) &
          done
          wait
        fi

  web:build:
    desc: "构建前端生产包"
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - pnpm run build

  web:test:
    desc: "运行前端测试（Vitest，所有 app）"
    dir: "webapps"
    cmds:
      - pnpm -r test

  web:lint:
    desc: "前端 ESLint 检查（所有 app）"
    dir: "webapps"
    cmds:
      - pnpm -r lint

  web:install:
    desc: "安装前端依赖"
    dir: "{{.FRONTEND_DIR}}"
    cmds:
      - pnpm install

  # ─────────────────────── 演示数据 ───────────────────────

  seed:
    desc: "Seed 演示数据（kb-svc 需 DASHSCOPE_API_KEY；用法见 scripts/seed/seed.mjs 头注释）"
    cmds:
      - node scripts/seed/seed.mjs {{.CLI_ARGS}}

  seed:order:
    desc: "仅 Seed 订单数据（order-svc 免外部依赖）"
    cmds:
      - node scripts/seed/seed.mjs --order-only {{.CLI_ARGS}}

  seed:kb:
    desc: "仅 Seed 知识库数据（需 DASHSCOPE_API_KEY）"
    cmds:
      - node scripts/seed/seed.mjs --kb-only {{.CLI_ARGS}}

  # ─────────────────────── 一站式工作流 ───────────────────────

  check:
    desc: "全量检查：后端 spotless + test + 前端 lint + 前端 test"
    cmds:
      - ./gradlew spotlessCheck test
      - task: web:lint
      - task: web:test

  fresh:
    desc: "清理后全量构建 + 测试"
    cmds:
      - ./gradlew clean build
