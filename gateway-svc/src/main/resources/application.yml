spring:
  application:
    name: gateway-svc
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: customer-agent
              uri: lb://customer-agent
              predicates:
                - Path=/api/customer/**,/api/agent/**
              filters:
                - StripPrefix=2
            - id: order-svc
              uri: lb://order-svc
              predicates:
                - Path=/api/order/**
              filters:
                - StripPrefix=2
            - id: kb-svc
              uri: lb://kb-svc
              predicates:
                - Path=/api/kb/**
              filters:
                - StripPrefix=2

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761}/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoint:
    gateway:
      access: unrestricted
  endpoints:
    web:
      exposure:
        include: gateway,health
  tracing:
    sampling:
      probability: 1.0

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
